name: Bounded NLB live validation
"on":
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nlb-live-validation
  cancel-in-progress: false
jobs:
  nlb:
    if: github.repository == 'hkwayapp/HKWay' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TOOL: Tools/HostedTransportValidation
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build standalone tool
        run: |
          set -euo pipefail
          swift --version
          swift build --package-path "$TOOL" -c release
      - name: Bounded NLB-only capture and private replay
        env:
          HKWAY_NLB_PRIVATE_DIAGNOSTICS: "1"
        run: |
          set -euo pipefail
          umask 077
          binary="$(swift build --package-path "$TOOL" -c release --show-bin-path)/HKWayDataGenerator"
          python3 "$TOOL/run_live_nlb.py" "$binary" Dataset TransportDatasetV1
