name: NLB Transport Publisher preflight
"on": workflow_dispatch
permissions:
  contents: read
concurrency:
  group: nlb-transport-publisher-preflight
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'hkwayapp/HKWay' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TOOL: Tools/HostedTransportValidation
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30eaf803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify existing hosted generator and serving snapshot
        run: |
          set -euo pipefail
          umask 077
          swift build --package-path "$TOOL" -c release
          binary="$(swift build --package-path "$TOOL" -c release --show-bin-path)/HKWayDataGenerator"
          work="$(mktemp -d "$RUNNER_TEMP/nlb-publisher-preview.XXXXXX")"
          trap 'rm -f "$work"/*.json; rmdir "$work"' EXIT
          python3 Tools/HKWayDataGenerator/WorkflowCandidates/prepare_nlb_publisher_preview.py \
            "$GITHUB_WORKSPACE" "$GITHUB_SHA" "$binary" "$work"
