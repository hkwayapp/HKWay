name: Weekly ferry dataset update

on:
  schedule:
    # Monday 04:30 Hong Kong time (Sunday 20:30 UTC), after the transport window.
    - cron: "30 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ferry-dataset-publication
  cancel-in-progress: false

jobs:
  refresh-ferry:
    if: github.repository == 'hkwayapp/HKWay' && github.ref == 'refs/heads/main'
    environment: ferry-publisher
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Run offline ferry checks
        run: python3 -B -m unittest discover -s Tools/HKWayFerryDataGenerator

      - name: Generate and validate ferry snapshot
        id: ferry
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          time python3 -B Tools/HKWayFerryDataGenerator/generate.py --output "$work/staged"
          python3 -B Tools/HKWayFerryDataGenerator/generate.py --validate-only --output "$work/staged"
          printf 'path=%s/staged\n' "$work" >> "$GITHUB_OUTPUT"

      - name: Stage validated ferry commit
        id: publication
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          STAGED_FERRY: ${{ steps.ferry.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p FerryDataset
          files=(ferry_manifest.json ferry_timetables.json ferry_fares.json)
          for file in "${files[@]}"; do
            cp "$STAGED_FERRY/$file" "FerryDataset/$file"
          done
          git add -- "${files[@]/#/FerryDataset/}"
          if git diff --cached --quiet; then
            echo 'No ferry content to publish.'
            exit 0
          fi
          git config user.name 'HK Way Dataset Bot'
          git config user.email 'actions@github.com'
          allowed=$(for file in "${files[@]}"; do printf "FerryDataset/%s\n" "$file"; done)
          while IFS= read -r -d '' path; do
            grep -Fxq -- "$path" <<< "$allowed" || { echo "Unexpected staged path"; exit 1; }
          done < <(git diff --cached --name-only --no-renames -z)
          git commit -m 'Update weekly ferry dataset'
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        if: steps.publication.outputs.changed == 'true'
        id: publisher
        with:
          client-id: 'Iv23li8YM9IhzhhZPKbl'
          private-key: ${{ secrets.DATASET_FERRY_APP_PRIVATE_KEY }}
          owner: hkwayapp
          repositories: HKWay
          permission-contents: write
          skip-token-revoke: false

      - name: Push validated commit with the dedicated publisher
        if: steps.publication.outputs.changed == 'true'
        env:
          PUBLISHER_TOKEN: ${{ steps.publisher.outputs.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          url=https://github.com/hkwayapp/HKWay.git
          auth=$(printf 'x-access-token:%s' "$PUBLISHER_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          unset PUBLISHER_TOKEN
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=3
          export GIT_CONFIG_KEY_0="http.$url.extraHeader" GIT_CONFIG_VALUE_0="Authorization: Basic $auth"
          export GIT_CONFIG_KEY_1=http.followRedirects GIT_CONFIG_VALUE_1=false
          export GIT_CONFIG_KEY_2=credential.helper GIT_CONFIG_VALUE_2=
          test "$(git ls-remote "$url" refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          hooks=$(mktemp -d)
          trap 'rm -f "$hooks/pre-push"; rmdir "$hooks"' EXIT
          cat > "$hooks/pre-push" <<'HOOK'
          #!/bin/sh
          read -r local_ref local_sha remote_ref remote_sha || exit 1
          test "$remote_ref" = refs/heads/main && test "$remote_sha" = "$GITHUB_SHA"
          HOOK
          chmod 700 "$hooks/pre-push"
          git -c core.hooksPath="$hooks" push --no-follow-tags "$url" HEAD:refs/heads/main
